complexity:
  LongMethod:
    threshold: 200        # NowPlayingScreen is ~185 lines; Compose UIs are naturally verbose
  LongParameterList:
    functionThreshold: 10 # Compose functions often have many params
    constructorThreshold: 8
  CyclomaticComplexMethod:
    threshold: 20         # handleLaunch when-expression covers all 14 LauncherAction branches
  TooManyFunctions:
    thresholdInClasses: 20
    thresholdInObjects: 20  # CarSystem object has 16 public functions (one per OEM app)
    thresholdInFiles: 20

naming:
  FunctionNaming:
    ignoreAnnotated:
      - 'Composable'      # PascalCase is correct for @Composable functions

style:
  MagicNumber:
    active: false         # too noisy for Compose layout/color code
  MaxLineLength:
    maxLineLength: 150    # Neumorphic.kt has lines up to ~144 chars
  ReturnCount:
    max: 4
  UnusedPrivateMember:
    active: true
  ForbiddenComment:
    active: false         # CarSystem.kt has a TODO: pending IPC confirmation

