<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400">
  <defs>
    <radialGradient id="bgGrad" cx="22%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#0E1826"/>
      <stop offset="100%" stop-color="#06090F"/>
    </radialGradient>
    <radialGradient id="logoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3D8EFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3D8EFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="divGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1A3D6E" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#1A3D6E" stop-opacity="1"/>
      <stop offset="75%"  stop-color="#1A3D6E" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1A3D6E" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="400" fill="url(#bgGrad)"/>

  <!-- Top edge highlight -->
  <rect x="0" y="0" width="1280" height="1" fill="#1A3A6A" opacity="0.4"/>

  <!-- Decorative gauge rings (right side) -->
  <g opacity="0.07" stroke="#4A9EFF" fill="none" stroke-width="1">
    <circle cx="1190" cy="200" r="130"/>
    <circle cx="1190" cy="200" r="180"/>
    <circle cx="1190" cy="200" r="230"/>
    <circle cx="1190" cy="200" r="280"/>
    <circle cx="1190" cy="200" r="330"/>
  </g>
  <!-- Radial tick marks on outermost arc -->
  <g opacity="0.06" stroke="#4A9EFF" stroke-width="1.5">
    <line x1="1060" y1="200" x2="1046" y2="200"/>
    <line x1="1190" y1="70"  x2="1190" y2="56"/>
    <line x1="1320" y1="200" x2="1334" y2="200"/>
    <line x1="1190" y1="330" x2="1190" y2="344"/>
    <line x1="1097" y1="107" x2="1087" y2="97"/>
    <line x1="1283" y1="107" x2="1293" y2="97"/>
    <line x1="1097" y1="293" x2="1087" y2="303"/>
    <line x1="1283" y1="293" x2="1293" y2="303"/>
  </g>

  <!-- Logo glow -->
  <circle cx="157" cy="200" r="150" fill="url(#logoGlow)"/>

  <!-- Steering wheel logo (256×256 scaled to 220×220, centered at 157,200) -->
  <!-- translate to (157-110, 200-110) = (47, 90), scale 220/256 = 0.8594 -->
  <g transform="translate(47, 90) scale(0.8594)">
    <!-- Spokes: 30°, 180°, 330° -->
    <line x1="128" y1="128" x2="176" y2="45"  stroke="#3D8EFF" stroke-width="10" stroke-linecap="round"/>
    <line x1="128" y1="128" x2="128" y2="224" stroke="#3D8EFF" stroke-width="10" stroke-linecap="round"/>
    <line x1="128" y1="128" x2="80"  y2="45"  stroke="#3D8EFF" stroke-width="10" stroke-linecap="round"/>
    <!-- Outer ring -->
    <circle cx="128" cy="128" r="96" fill="none" stroke="#3D8EFF" stroke-width="11"/>
    <!-- Hub -->
    <circle cx="128" cy="128" r="22" fill="#3D8EFF"/>
    <circle cx="128" cy="128" r="10" fill="#06090F"/>
  </g>

  <!-- Vertical divider -->
  <line x1="315" y1="0" x2="315" y2="400" stroke="url(#divGrad)" stroke-width="1"/>

  <!-- HELM -->
  <text x="358" y="218"
        font-family="Impact, 'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-size="112" font-weight="900" letter-spacing="10"
        fill="#FFFFFF">HELM</text>

  <!-- Tagline -->
  <text x="361" y="260"
        font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"
        font-size="19" font-weight="400" letter-spacing="4"
        fill="#4A9EFF">AN OPEN PLATFORM FOR ANDROID HEAD UNITS</text>

  <!-- Tech stack line -->
  <text x="361" y="308"
        font-family="'Courier New', Courier, monospace"
        font-size="13" letter-spacing="2"
        fill="#2A5A8A">KOTLIN  ·  JETPACK COMPOSE  ·  ANDROID 10  ·  ALLWINNER A133  ·  ARMEABI-V7A</text>

  <!-- Bottom accent line -->
  <rect x="358" y="330" width="700" height="1" fill="#1A3D6E" opacity="0.7"/>
</svg>
